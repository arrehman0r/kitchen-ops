<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cuisine By Ayesha Kamil — Kitchen Ops (Prototype)</title>
<!--
  ============================================================================
  CLICKABLE PROTOTYPE · Kitchen Operations System  ·  built by Quantum Force
  ----------------------------------------------------------------------------
  This is an INTERACTIVE mockup for the client meeting (not the real app).
  Everything runs in-memory in the browser — works fully offline, zero install.

  THE DEMO STORY (walk the client through this):
    1. A Foodpanda order arrives  → click "Simulate Foodpanda order"
       → recipe auto-deducts ingredients (rice/chicken/masala drop live)
    2. Fire a few more → a LOW-STOCK ALERT appears
    3. Ring up a WALK-IN order in the POS → generate an INVOICE
    4. Log an EXPENSE (or restock an ingredient)
    5. Dashboard shows PROFIT SPLIT BY CHANNEL
       (walk-in full margin vs Foodpanda AFTER ~30% commission)

  REBRAND: find & replace "Cuisine By Ayesha Kamil" · colours in :root below.
  ============================================================================
-->
<style>
  :root{
    --bg:#15100E;
    --bg2:#1E1614;
    --panel:#241B18;
    --panel2:#2C211D;
    --line:rgba(255,244,232,.09);
    --line2:rgba(255,244,232,.16);
    --txt:#FBF1E6;
    --muted:rgba(251,241,230,.62);
    --muted2:rgba(251,241,230,.40);
    --accent:#FF7A1A;
    --accent-soft:#FF9D4D;
    --accent2:#E63946;
    --gold:#F4B860;
    --green:#34D399;
    --red:#FB7185;
    --radius:14px;
    --font:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--txt);overflow:hidden;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(255,244,232,.14);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- app shell ---------- */
  .app{display:grid;grid-template-columns:236px 1fr;height:100vh}

  .sidebar{background:linear-gradient(180deg,#1C1411,#160F0D);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
  .brand .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 22px rgba(255,122,26,.35)}
  .brand b{font-size:15px;line-height:1.1}
  .brand small{display:block;color:var(--muted2);font-size:11px;margin-top:2px}
  .nav-i{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:.15s;position:relative}
  .nav-i .e{font-size:17px;width:20px;text-align:center}
  .nav-i:hover{background:var(--panel);color:var(--txt)}
  .nav-i.on{background:linear-gradient(100deg,rgba(255,122,26,.18),rgba(230,57,70,.10));color:var(--txt);border-color:rgba(255,122,26,.28)}
  .nav-i.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
  .nav-tag{margin-left:auto;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--accent2);color:#fff}
  .side-foot{margin-top:auto;padding:10px 8px;color:var(--muted2);font-size:11px;line-height:1.5;border-top:1px solid var(--line)}

  .main{display:flex;flex-direction:column;overflow:hidden}
  .topbar{display:flex;align-items:center;gap:14px;padding:15px 26px;border-bottom:1px solid var(--line);background:var(--bg2)}
  .topbar h1{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .topbar .sub{color:var(--muted);font-size:12.5px;margin-top:1px}
  .topbar .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid var(--line2);background:var(--panel);color:var(--txt);font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;font-family:inherit}
  .btn:hover{border-color:var(--accent);background:var(--panel2)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(255,122,26,.30)}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
  .btn.live{position:relative}
  .btn.live::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

  .content{flex:1;overflow:auto;padding:24px 26px 60px}

  /* ---------- generic ---------- */
  .grid{display:grid;gap:16px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .card h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .row{display:flex;align-items:center;gap:12px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .muted{color:var(--muted)}.small{font-size:12.5px}
  .sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);font-weight:800;margin:26px 0 12px}

  /* kpi */
  .kpi .t{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .kpi .v{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
  .kpi .d{font-size:12px;margin-top:7px;font-weight:700}
  .kpi .ic{float:right;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,rgba(255,122,26,.2),rgba(230,57,70,.14));border:1px solid rgba(255,122,26,.25)}
  .up{color:var(--green)}.down{color:var(--red)}

  /* badges */
  .badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .b-fp{background:rgba(230,57,70,.16);color:#ff8e98}
  .b-wi{background:rgba(52,211,153,.15);color:#5ee9b5}
  .b-low{background:rgba(244,184,96,.16);color:var(--gold)}
  .b-ok{background:rgba(52,211,153,.13);color:#5ee9b5}
  .b-out{background:rgba(230,57,70,.18);color:#ff8e98}

  /* table */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(255,244,232,.025)}
  .t-right{text-align:right}

  /* stock bar */
  .stockbar{height:8px;border-radius:6px;background:rgba(255,244,232,.08);overflow:hidden;margin-top:7px}
  .stockbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .stockbar i.low{background:linear-gradient(90deg,var(--accent2),var(--gold))}

  /* filters */
  .filters{display:flex;gap:8px;margin-bottom:16px}
  .chip{font-size:13px;padding:8px 15px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);cursor:pointer;font-weight:700;transition:.15s}
  .chip:hover{color:var(--txt)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#1a0f06}

  /* POS */
  .pos{display:grid;grid-template-columns:1fr 340px;gap:18px;height:100%}
  .dishgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px;align-content:start}
  .dish{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer;transition:.15s;text-align:left}
  .dish:hover{border-color:var(--accent);transform:translateY(-3px);background:var(--panel2)}
  .dish .e{font-size:30px}
  .dish b{display:block;margin-top:9px;font-size:14px}
  .dish .pr{color:var(--accent-soft);font-weight:800;font-size:14px;margin-top:5px}
  .dish .mg{font-size:11px;color:var(--muted2);margin-top:3px}
  .cartbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
  .cartbox .hd{padding:15px 16px;border-bottom:1px solid var(--line);font-weight:800;display:flex;align-items:center;gap:9px}
  .cartlist{flex:1;overflow:auto;padding:8px 12px;min-height:120px}
  .citem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .citem:last-child{border-bottom:none}
  .citem .nm{flex:1;font-size:13px}.citem .nm small{display:block;color:var(--muted2);font-size:11px}
  .qtybtn{width:24px;height:24px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);cursor:pointer;font-weight:800;font-size:14px;line-height:1}
  .qtybtn:hover{border-color:var(--accent)}
  .cart-empty{color:var(--muted2);text-align:center;padding:34px 10px;font-size:13px}
  .carttot{padding:14px 16px;border-top:1px solid var(--line);background:var(--bg2)}

  /* expense form */
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
  .inp{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt);font-size:14px;font-family:inherit}
  .inp:focus{outline:none;border-color:var(--accent)}
  select.inp{cursor:pointer}

  /* toast */
  #toasts{position:fixed;right:22px;bottom:22px;z-index:90;display:flex;flex-direction:column;gap:10px;max-width:360px}
  .toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--accent);border-radius:12px;padding:13px 15px;box-shadow:0 16px 40px rgba(0,0,0,.5);animation:slidein .4s both}
  .toast.green{border-left-color:var(--green)}
  .toast.red{border-left-color:var(--accent2)}
  .toast.gold{border-left-color:var(--gold)}
  .toast b{font-size:13.5px;display:block;margin-bottom:3px}
  .toast p{font-size:12.5px;color:var(--muted);line-height:1.45}
  @keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
  @keyframes flashrow{0%{background:rgba(255,122,26,.22)}100%{background:transparent}}
  .flash{animation:flashrow 1.4s ease}

  /* modal */
  #modal{position:fixed;inset:0;z-index:100;background:rgba(8,5,4,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px}
  #modal.show{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line2);border-radius:18px;width:100%;max-width:430px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .3s both;overflow:hidden}
  @keyframes pop{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}
  .sheet .sh-hd{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .sheet .sh-bd{padding:20px}
  .sheet .x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1;background:none;border:none}

  /* invoice */
  .inv{font-size:13px}
  .inv .ihd{text-align:center;padding-bottom:14px;border-bottom:2px dashed var(--line2);margin-bottom:14px}
  .inv .ihd .lg{font-size:26px}
  .inv .ihd b{display:block;font-size:16px;margin-top:4px}
  .inv .ihd small{color:var(--muted)}
  .inv table td{padding:6px 0;border:none;font-size:13px}
  .inv .tot{border-top:2px dashed var(--line2);margin-top:10px;padding-top:10px}
  .inv .tot .big{font-size:20px;font-weight:800}
  .inv .thanks{text-align:center;color:var(--muted);margin-top:14px;font-size:12px}

  .empty{color:var(--muted2);text-align:center;padding:40px;font-size:13.5px}

  @media print{
    body *{visibility:hidden}
    #invoicePrint,#invoicePrint *{visibility:visible}
    #invoicePrint{position:fixed;inset:0;background:#fff;color:#000;padding:30px}
    #invoicePrint .ihd{border-color:#000}#invoicePrint .tot{border-color:#000}
  }
</style>
</head>
<body>
<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">🍽️</div>
      <div><b id="brandName">Cuisine By Ayesha Kamil</b><small>Kitchen Ops · v0 prototype</small></div>
    </div>
    <div class="nav-i on" data-view="dashboard"><span class="e">📊</span> Dashboard</div>
    <div class="nav-i" data-view="orders"><span class="e">🧾</span> Orders <span class="nav-tag" id="navOrders" style="display:none">0</span></div>
    <div class="nav-i" data-view="pos"><span class="e">🛒</span> Walk-in POS</div>

    <div class="side-foot">
      <b style="color:var(--muted)">Quantum Force</b><br>
      Prototype for client review.<br>Data is simulated &amp; in-memory.
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>

      <button class="btn primary" onclick="go('pos')">＋ New walk-in sale</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="toasts"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>

];
const ing = id => ingredients.find(x=>x.id===id);

// Menu items + recipe (BOM) + Foodpanda product code + category
const menu = [
  // Breakfast
  { id:'toast_bread', cat:'Breakfast', name:'Toasted Bread (2 pcs)', emoji:'🍞', price:50,  fp:'FP-101', recipe:[['bread',2],['oil',3]] },

  // Pakistani Cuisine

const recipeCost = m => m.recipe.reduce((s,[iid,q])=>s + q*ing(iid).cost, 0);
const orderItemsCost = items => items.reduce((s,it)=>s + recipeCost(dish(it.id))*it.qty, 0);

// deduct ingredients for a set of order items; returns list of {iid, qty} consumed
function consume(items){
  const used = {};
  items.forEach(it=>{
    dish(it.id).recipe.forEach(([iid,q])=>{ used[iid]=(used[iid]||0)+q*it.qty; });
  });
  Object.entries(used).forEach(([iid,q])=>{ ing(iid).stock = Math.max(0, ing(iid).stock - q); });
  return Object.entries(used).map(([iid,q])=>({iid,q}));
}

function pushOrder(channel, itemPairs, time, payment, doConsume=true){
  const items = itemPairs.map(([id,qty])=>({id,qty}));
  const gross = items.reduce((s,it)=>s + dish(it.id).price*it.qty, 0);
  const commission = channel==='foodpanda' ? Math.round(gross*settings.fpCommission/100) : 0;
  const net = gross - commission;
  const o = { id:'#'+(state.seq++), channel, items, gross, commission, net, time:time||Date.now(), payment };
  state.orders.unshift(o);
  if(doConsume) o.consumed = consume(items);
  return o;
}

function checkLowStock(before){
  ingredients.forEach(i=>{
    const was = before?before.find(b=>b.id===i.id).stock:Infinity;
    if(i.stock<=i.reorder && was>i.reorder){
      toast('⚠️ Low stock: '+i.name, `Only ${fmtQty(i.stock,i.unit)} left (reorder at ${fmtQty(i.reorder,i.unit)}). Time to restock.`, 'gold');
    }
  });
}

  if(!state.cart.length) return;
  const before = ingredients.map(i=>({id:i.id,stock:i.stock}));

function restock(iid){
  const i = ing(iid);
  const addQty = i.unit==='pc' ? 60 : 20000; // +60 pcs or +20kg/L
  i.stock += addQty;
  const cost = Math.round(addQty*i.cost);
  addTxn({kind:'expense',accountId:'cash',categoryId:'c_ingredients',amount:cost,note:`Restock ${i.name} (+${fmtQty(addQty,i.unit)})`});
  toast('📦 Restocked '+i.name, `Added ${fmtQty(addQty,i.unit)} · logged ${fmtPKR(cost)} expense`, 'green');
  render();
}

/* ==========================================================================
   FORMAT HELPERS
   ========================================================================== */
function fmtPKR(n){ return 'Rs '+Math.round(n).toLocaleString('en-PK'); }
function fmtQty(q,unit){
  if(unit==='pc') return q+' pc';
  if(q>=1000) return (q/1000).toLocaleString('en-PK',{maximumFractionDigits:2})+(unit==='ml'?' L':' kg');
  return Math.round(q)+' '+unit;
}
function timeAgo(t){
  const m=Math.round((Date.now()-t)/60000);
  if(m<1)return'just now'; if(m<60)return m+'m ago';
  const h=Math.round(m/60); return h+'h ago';
}

/* ==========================================================================

   ========================================================================== */
function totals(){
  const o=state.orders;
  const fp=o.filter(x=>x.channel==='foodpanda'), wi=o.filter(x=>x.channel==='walkin');
  const sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
  const fpGross=sum(fp,'gross'), fpComm=sum(fp,'commission'), fpNet=sum(fp,'net');
  const wiGross=sum(wi,'gross');
  const fpCost=fp.reduce((s,x)=>s+orderItemsCost(x.items),0);
  const wiCost=wi.reduce((s,x)=>s+orderItemsCost(x.items),0);
  const exp=state.txns.filter(t=>t.kind==='expense').reduce((s,x)=>s+x.amount,0);
  const revenueNet=fpNet+wiGross;
  const foodCost=fpCost+wiCost;
  const grossSales=fpGross+wiGross;
  return {
    fpCount:fp.length, wiCount:wi.length, count:o.length,
    fpGross, fpComm, fpNet, fpCost, fpProfit:fpNet-fpCost,
    wiGross, wiCost, wiProfit:wiGross-wiCost,
    grossSales, revenueNet, foodCost, expenses:exp,
    foodCostPct: grossSales? Math.round(foodCost/grossSales*100):0,
    netProfit: revenueNet - foodCost - exp,
  };
}
function dishCounts(){
  const m={};
  state.orders.forEach(o=>o.items.forEach(it=>{ m[it.id]=(m[it.id]||0)+it.qty; }));
  return Object.entries(m).map(([id,q])=>({id,q})).sort((a,b)=>b.q-a.q);
}

/* ==========================================================================

// entry-unit → base-unit conversion (UI lets owner think in kg/L/pcs)
const ENTRY = { kg:{base:'g',f:1000}, g:{base:'g',f:1}, L:{base:'ml',f:1000}, ml:{base:'ml',f:1}, pc:{base:'pc',f:1} };
const defaultEntry = u => u==='g'?'kg':u==='ml'?'L':'pc';

/* ---------- INGREDIENT FORM ---------- */
function openIngredientForm(id){
  const i = id?ing(id):null;
  const eu = i?defaultEntry(i.unit):'kg', f = ENTRY[eu].f;
  const v = i ? {name:i.name,emoji:i.emoji,eu,stock:i.stock/f,reorder:i.reorder/f,cost:+(i.cost*f).toFixed(2),perish:!!i.perishable}
              : {name:'',emoji:'📦',eu:'kg',stock:'',reorder:'',cost:'',perish:false};
  openModal(`
    <div class="sh-hd"><b>${i?'Edit ingredient':'New ingredient'}</b><button class="x" onclick="closeModal()">✕</button></div>
    <div class="sh-bd">
      <div class="grid g2" style="gap:12px">
        <div class="field" style="grid-column:span 2"><label>Ingredient name</label><input class="inp" id="igName" value="${v.name}" placeholder="e.g. Basmati Rice"></div>
        <div class="field"><label>Icon</label><input class="inp" id="igEmoji" value="${v.emoji}" maxlength="2"></div>
        <div class="field"><label>Measured in</label><select class="inp" id="igUnit">${['kg','g','L','ml','pc'].map(u=>`<option ${u===v.eu?'selected':''}>${u}</option>`).join('')}</select></div>
        <div class="field"><label>Current stock</label><input class="inp" id="igStock" type="number" value="${v.stock}" placeholder="e.g. 60"></div>
        <div class="field"><label>Reorder level</label><input class="inp" id="igReorder" type="number" value="${v.reorder}" placeholder="e.g. 12"></div>
        <div class="field" style="grid-column:span 2"><label>Unit cost (Rs per measured unit)</label><input class="inp" id="igCost" type="number" step="0.01" value="${v.cost}" placeholder="e.g. 220 (Rs per kg)"></div>
        <div class="field" style="grid-column:span 2"><label style="display:flex;align-items:center;gap:9px;cursor:pointer;font-weight:600;text-transform:none;color:var(--txt)"><input type="checkbox" id="igPerish" ${v.perish?'checked':''} style="accent-color:var(--accent);width:16px;height:16px"> Perishable — track expiry</label></div>
      </div>
      <div class="grid ${i?'g2':''}" style="margin-top:8px;gap:10px">
        ${i?`<button class="btn" style="justify-content:center;border-color:var(--accent2);color:var(--red)" onclick="deleteIngredient('${id}')">🗑 Delete</button>`:''}
        <button class="btn primary" style="justify-content:center" onclick="saveIngredient('${id||''}')">${i?'Save changes':'Add ingredient'}</button>
      </div>
    </div>`);
}
function saveIngredient(id){
  const name=document.getElementById('igName').value.trim();
  if(!name){ toast('Name required','Please enter an ingredient name.','red'); return; }
  const eu=document.getElementById('igUnit').value, {base,f}=ENTRY[eu];
  const data={ name, emoji:document.getElementById('igEmoji').value.trim()||'📦', unit:base,
    stock:(parseFloat(document.getElementById('igStock').value)||0)*f,
    reorder:(parseFloat(document.getElementById('igReorder').value)||0)*f,
    cost:(parseFloat(document.getElementById('igCost').value)||0)/f,
    perishable:document.getElementById('igPerish').checked };
  if(id){ Object.assign(ing(id),data); toast('✅ Ingredient updated',name,'green'); }
  else { ingredients.push({id:'ing'+(state.seq++),...data}); toast('✅ Ingredient added',`${data.emoji} ${name} · ${fmtQty(data.stock,base)} in stock`,'green'); }
  closeModal(); render();
}
function deleteIngredient(id){
  const usedIn=menu.filter(m=>m.recipe.some(([iid])=>iid===id)).map(m=>m.name);
  if(usedIn.length){ toast('Cannot delete','Used in: '+usedIn.join(', ')+'. Remove from those recipes first.','red'); return; }
  const idx=ingredients.findIndex(x=>x.id===id); if(idx>-1)ingredients.splice(idx,1);
  closeModal(); toast('🗑 Ingredient removed','','gold'); render();
}

/* ---------- PHYSICAL STOCK COUNT (reconciliation) ---------- */
function openAdjustForm(id){
  const i=ing(id), eu=defaultEntry(i.unit);
  openModal(`
    <div class="sh-hd"><b>📋 Physical count · ${i.emoji} ${i.name}</b><button class="x" onclick="closeModal()">✕</button></div>
    <div class="sh-bd">
      <p class="muted small" style="margin-bottom:14px">Count what's physically on the shelf. The difference is logged as a stock adjustment — this captures real-world wastage, spillage and staff meals.</p>
      <div class="between" style="background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px"><span class="muted">System says</span><b>${fmtQty(i.stock,i.unit)}</b></div>
      <div class="field"><label>Actual counted (${eu})</label><input class="inp" id="adjVal" type="number" value="${+(i.stock/ENTRY[eu].f).toFixed(2)}" oninput="adjPreview('${id}','${eu}')"></div>
      <div id="adjPrev" class="small" style="margin-bottom:14px"></div>
      <button class="btn primary" style="width:100%;justify-content:center" onclick="saveAdjust('${id}','${eu}')">Apply adjustment</button>
    </div>`);
  adjPreview(id,eu);
}
function adjPreview(id,eu){
  const i=ing(id), counted=(parseFloat(document.getElementById('adjVal').value)||0)*ENTRY[eu].f, diff=counted-i.stock;
  const el=document.getElementById('adjPrev');
  el.innerHTML = Math.abs(diff)<0.5 ? '<span class="muted">No difference.</span>'
    : diff<0 ? `<span style="color:var(--red)">▼ ${fmtQty(-diff,i.unit)} shrinkage</span> — value ${fmtPKR(-diff*i.cost)} written off.`
             : `<span style="color:var(--green)">▲ ${fmtQty(diff,i.unit)} found</span> will be added.`;
}
function saveAdjust(id,eu){
  const i=ing(id), counted=(parseFloat(document.getElementById('adjVal').value)||0)*ENTRY[eu].f, diff=counted-i.stock;
  i.stock=counted; closeModal();
  toast('📋 Stock adjusted: '+i.name, `${diff<0?'▼ '+fmtQty(-diff,i.unit)+' written off':'▲ '+fmtQty(Math.abs(diff),i.unit)+' added'} · now ${fmtQty(i.stock,i.unit)}`, diff<0?'gold':'green');
  render();
}

/* ---------- RECIPE / DISH FORM (with live food-cost) ---------- */
let draftRecipe=null;
function openRecipeForm(id){
  const m=id?dish(id):null;
  draftRecipe = m ? {id,name:m.name,emoji:m.emoji,price:m.price,fp:m.fp,cat:m.cat||'Pakistani Cuisine',lines:m.recipe.map(([iid,q])=>({iid,q}))}
                  : {id:null,name:'',emoji:'🍽️',price:'',fp:'',cat:'Pakistani Cuisine',lines:[{iid:ingredients[0].id,q:''}]};
  renderRecipeForm();
}
function captureRecipe(){
  if(!document.getElementById('rcName'))return;
  draftRecipe.name=document.getElementById('rcName').value;
  draftRecipe.emoji=document.getElementById('rcEmoji').value;
  draftRecipe.price=document.getElementById('rcPrice').value;
  draftRecipe.fp=document.getElementById('rcFp').value;
  if(document.getElementById('rcCat')) draftRecipe.cat=document.getElementById('rcCat').value;
  draftRecipe.lines=[...document.querySelectorAll('.rl')].map(r=>({iid:r.querySelector('.rl-ing').value,q:r.querySelector('.rl-qty').value}));
}
function recipeAddLine(){ captureRecipe(); draftRecipe.lines.push({iid:ingredients[0].id,q:''}); renderRecipeForm(); }
function recipeDelLine(idx){ captureRecipe(); draftRecipe.lines.splice(idx,1); renderRecipeForm(); }
function recipeLiveCost(){
  let cost=0;
  document.querySelectorAll('.rl').forEach(r=>{
    const i=ing(r.querySelector('.rl-ing').value), q=parseFloat(r.querySelector('.rl-qty').value)||0;
    cost+=q*i.cost;
    const c=r.querySelector('.rl-cost'); if(c)c.textContent=fmtPKR(q*i.cost);
    const u=r.querySelector('.rl-unit'); if(u)u.textContent=i.unit;
  });
  const price=parseFloat(document.getElementById('rcPrice').value)||0;
  const fpProfit=price*(1-settings.fpCommission/100)-cost;
  document.getElementById('rcCost').textContent=fmtPKR(cost);
  document.getElementById('rcMargin').innerHTML=price?`<b style="color:var(--green)">${fmtPKR(price-cost)}</b> <span class="muted small">${Math.round((price-cost)/price*100)}%</span>`:'—';
  document.getElementById('rcFpProfit').innerHTML=price?`<b style="color:var(--accent-soft)">${fmtPKR(fpProfit)}</b>`:'—';
}
function recipeLineHtml(ln,idx){
  return `<div class="rl row" style="gap:8px;margin-bottom:8px">
    <select class="inp rl-ing" style="flex:2" onchange="recipeLiveCost()">${ingredients.map(i=>`<option value="${i.id}" ${i.id===ln.iid?'selected':''}>${i.emoji} ${i.name}</option>`).join('')}</select>
    <input class="inp rl-qty" style="flex:1;min-width:60px" type="number" value="${ln.q}" placeholder="qty" oninput="recipeLiveCost()">
    <span class="rl-unit muted small" style="width:22px">${ing(ln.iid).unit}</span>
    <span class="rl-cost muted small" style="width:62px;text-align:right">—</span>
    <button class="qtybtn" onclick="recipeDelLine(${idx})" title="Remove line">✕</button>
  </div>`;
}
function renderRecipeForm(){
  const d=draftRecipe;
  openModal(`
    <div class="sh-hd"><b>${d.id?'Edit recipe':'New dish & recipe'}</b><button class="x" onclick="closeModal()">✕</button></div>
    <div class="sh-bd" style="max-height:80vh;overflow:auto">
      <div class="grid g2" style="gap:12px">
        <div class="field" style="grid-column:span 2"><label>Dish name</label><input class="inp" id="rcName" value="${d.name}" placeholder="e.g. Chicken Biryani"></div>
        <div class="field"><label>Icon</label><input class="inp" id="rcEmoji" value="${d.emoji}" maxlength="2"></div>
        <div class="field"><label>Sell price (Rs)</label><input class="inp" id="rcPrice" type="number" value="${d.price}" placeholder="450" oninput="recipeLiveCost()"></div>
        <div class="field"><label>Category</label><select class="inp" id="rcCat">${[...new Set([...CATS, d.cat])].map(ct=>`<option ${ct===d.cat?'selected':''}>${ct}</option>`).join('')}</select></div>
        <div class="field"><label>Foodpanda code</label><input class="inp" id="rcFp" value="${d.fp}" placeholder="e.g. FP-101"></div>
      </div>
      <div class="sec-title" style="margin:8px 0 10px">Recipe — ingredients used per plate</div>
      <div id="rcLines">${d.lines.map((ln,idx)=>recipeLineHtml(ln,idx)).join('')||'<p class="muted small">No ingredients yet — add one below.</p>'}</div>
      <button class="btn sm" style="margin-top:4px" onclick="recipeAddLine()">＋ Add ingredient</button>
      <div style="margin-top:16px;padding:13px 15px;background:var(--bg2);border:1px solid var(--line);border-radius:12px">
        <div class="grid g3" style="text-align:center;gap:8px">
          <div><div class="small muted">Food cost</div><b id="rcCost">—</b></div>
          <div><div class="small muted">Walk-in profit</div><span id="rcMargin">—</span></div>
          <div><div class="small muted">Foodpanda profit</div><span id="rcFpProfit">—</span></div>
        </div>
      </div>
      <div class="grid ${d.id?'g2':''}" style="margin-top:16px;gap:10px">
        ${d.id?`<button class="btn" style="justify-content:center;border-color:var(--accent2);color:var(--red)" onclick="deleteRecipe('${d.id}')">🗑 Delete</button>`:''}
        <button class="btn primary" style="justify-content:center" onclick="saveRecipe()">${d.id?'Save changes':'Add dish'}</button>
      </div>
    </div>`);
  recipeLiveCost();
}
function saveRecipe(){
  captureRecipe();
  const d=draftRecipe, name=d.name.trim(), price=parseFloat(d.price)||0;
  const lines=d.lines.map(l=>({iid:l.iid,q:parseFloat(l.q)||0})).filter(l=>l.q>0);
  if(!name){ toast('Name required','Enter a dish name.','red'); return; }
  if(price<=0){ toast('Price required','Enter a sell price.','red'); return; }
  if(!lines.length){ toast('Recipe empty','Add at least one ingredient with a quantity.','red'); return; }
  const recipe=lines.map(l=>[l.iid,l.q]);
  if(d.id){ Object.assign(dish(d.id),{name,emoji:d.emoji||'🍽️',price,fp:d.fp.trim(),cat:d.cat||'Other',recipe}); toast('✅ Recipe updated',name,'green'); }
  else { menu.push({id:'dish'+(state.seq++),cat:d.cat||'Other',name,emoji:d.emoji||'🍽️',price,fp:d.fp.trim()||('FP-'+state.seq),recipe}); toast('✅ Dish added',`${d.emoji} ${name} · ${lines.length} ingredients`,'green'); }
  closeModal(); render();
}
function deleteRecipe(id){
  const idx=menu.findIndex(x=>x.id===id); if(idx>-1)menu.splice(idx,1);
  state.cart=state.cart.filter(c=>c.id!==id);
  closeModal(); toast('🗑 Dish removed','','gold'); render();
}

/* ---------- FINANCE: transaction / category / account forms ---------- */
function openTxnForm(type){
  const tt=type||'expense', cats=categories.filter(c=>c.kind===tt);
  openModal(`
    <div class="sh-hd"><b>Add transaction</b><button class="x" onclick="closeModal()">✕</button></div>
    <div class="sh-bd">
      <div class="row" style="gap:6px;margin-bottom:16px">
        ${['expense','income','transfer'].map(k=>`<button class="btn sm ${k===tt?'primary':''}" style="flex:1;justify-content:center" onclick="openTxnForm('${k}')">${k==='expense'?'➖ Expense':k==='income'?'➕ Income':'🔄 Transfer'}</button>`).join('')}
      </div>
      <div class="field"><label>Amount (Rs)</label><input class="inp" id="txAmt" type="number" placeholder="e.g. 5000" autofocus></div>
      ${tt==='transfer' ? `
        <div class="field"><label>From account</label><select class="inp" id="txAcc">${accounts.map(a=>`<option value="${a.id}">${a.icon} ${a.name} · ${fmtPKR(accountBalance(a.id))}</option>`).join('')}</select></div>
        <div class="field"><label>To account</label><select class="inp" id="txTo">${accounts.map((a,i)=>`<option value="${a.id}" ${i===1?'selected':''}>${a.icon} ${a.name}</option>`).join('')}</select></div>`
      : `
        <div class="field"><label>${tt==='expense'?'Paid from':'Deposit to'} account</label><select class="inp" id="txAcc">${accounts.map(a=>`<option value="${a.id}">${a.icon} ${a.name} · ${fmtPKR(accountBalance(a.id))}</option>`).join('')}</select></div>
        <div class="field"><label>Category</label><div class="row" style="gap:8px">
          <select class="inp" id="txCat" style="flex:1">${cats.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('')}</select>
          <button class="btn sm" onclick="openCategoryForm('${tt}')" title="New category">＋</button>
        </div></div>`}
      <div class="field"><label>Note (optional)</label><input class="inp" id="txNote" placeholder="e.g. supplier payment"></div>
      <button class="btn primary" style="width:100%;justify-content:center" onclick="saveTxn('${tt}')">Save ${tt}</button>
    </div>`);
}
function saveTxn(tt){
  const amount=parseFloat(document.getElementById('txAmt').value)||0;
  if(amount<=0){ toast('Enter an amount','Please enter a valid amount.','red'); return; }
  const accountId=document.getElementById('txAcc').value;
  const note=document.getElementById('txNote')?document.getElementById('txNote').value.trim():'';
  if(tt==='transfer'){
    const toAccountId=document.getElementById('txTo').value;
    if(toAccountId===accountId){ toast('Pick two accounts','A transfer needs two different accounts.','red'); return; }
    addTxn({kind:'transfer',accountId,toAccountId,amount,note:note||'Transfer'});
    toast('🔄 Transfer saved',`${fmtPKR(amount)} · ${account(accountId).name} → ${account(toAccountId).name}`,'green');
  } else {
    const categoryId=document.getElementById('txCat').value;
    addTxn({kind:tt,accountId,categoryId,amount,note:note||category(categoryId).name});
    toast(tt==='expense'?'➖ Expense recorded':'➕ Income recorded',`${category(categoryId).name}: ${fmtPKR(amount)}`, tt==='expense'?'gold':'green');
  }
  closeModal(); render();
}
function openCategoryForm(kind){
  openModal(`
    <div class="sh-hd"><b>New category</b><button class="x" onclick="closeModal()">✕</button></div>
    <div class="sh-bd">
      <div class="grid g2" style="gap:12px">
        <div class="field" style="grid-column:span 2"><label>Category name</label><input class="inp" id="catName" placeholder="e.g. Marketing"></div>
        <div class="field"><label>Icon</label><input class="inp" id="catIcon" value="🏷️" maxlength="2"></div>
        <div class="field"><label>Type</label><select class="inp" id="catKind"><option value="expense" ${kind!=='income'?'selected':''}>Expense</option><option value="income" ${kind==='income'?'selected':''}>Income</option></select></div>
      </div>
      <button class="btn primary" style="width:100%;justify-content:center;margin-top:6px" onclick="saveCategory()">Add category</button>
    </div>`);
}
function saveCategory(){
  const name=document.getElementById('catName').value.trim();
  if(!name){ toast('Name required','Enter a category name.','red'); return; }
  const kind=document.getElementById('catKind').value;
  categories.push({id:'cat'+(state.seq++),name,icon:document.getElementById('catIcon').value.trim()||'🏷️',kind});
  toast('✅ Category added',`${name} (${kind})`,'green');
  openTxnForm(kind);
}
function openAccountForm(id){
  const a=id?account(id):null;
  openModal(`
    <div class="sh-hd"><b>${a?'Edit account':'New account'}</b><button class="x" onclick="closeModal()">✕</button></div>
    <div class="sh-bd">
      <div class="grid g2" style="gap:12px">
        <div class="field" style="grid-column:span 2"><label>Account name</label><input class="inp" id="acName" value="${a?a.name:''}" placeholder="e.g. Meezan Bank"></div>
        <div class="field"><label>Icon</label><input class="inp" id="acIcon" value="${a?a.icon:'🏦'}" maxlength="2"></div>
        <div class="field"><label>Opening balance (Rs)</label><input class="inp" id="acOpen" type="number" value="${a?a.opening:''}" placeholder="0"></div>
      </div>
      ${a?`<p class="muted small" style="margin:2px 0 12px">Current balance ${fmtPKR(accountBalance(id))} (opening + transactions).</p>`:''}
      <div class="grid ${a?'g2':''}" style="margin-top:4px;gap:10px">
        ${a?`<button class="btn" style="justify-content:center;border-color:var(--accent2);color:var(--red)" onclick="deleteAccount('${id}')">🗑 Delete</button>`:''}
        <button class="btn primary" style="justify-content:center" onclick="saveAccount('${id||''}')">${a?'Save changes':'Add account'}</button>
      </div>
    </div>`);
}
function saveAccount(id){
  const name=document.getElementById('acName').value.trim();
  if(!name){ toast('Name required','Enter an account name.','red'); return; }
  const data={name,icon:document.getElementById('acIcon').value.trim()||'🏦',opening:parseFloat(document.getElementById('acOpen').value)||0};
  if(id){ Object.assign(account(id),data); toast('✅ Account updated',name,'green'); }
  else { accounts.push({id:'acc'+(state.seq++),...data}); toast('✅ Account added',`${data.icon} ${name}`,'green'); }
  closeModal(); render();
}
function deleteAccount(id){
  if(accounts.length<=1){ toast('Keep one account','You need at least one account.','red'); return; }
  if(state.txns.some(t=>t.accountId===id||t.toAccountId===id)){ toast('Cannot delete','This account has transactions.','red'); return; }
  const idx=accounts.findIndex(a=>a.id===id); if(idx>-1)accounts.splice(idx,1);
  closeModal(); toast('🗑 Account removed','','gold'); render();
}

/* ---------- SETTINGS ---------- */
function openSettings(){
  openModal(`
    <div class="sh-hd"><b>⚙️ Settings</b><button class="x" onclick="closeModal()">✕</button></div>
    <div class="sh-bd">
      <div class="field"><label>Business name (shown on invoices)</label><input class="inp" id="setName" value="${settings.businessName}"></div>
      <div class="field"><label>Foodpanda commission (%)</label><input class="inp" id="setComm" type="number" value="${settings.fpCommission}"></div>
      <p class="muted small" style="margin-bottom:16px">Commission is deducted from Foodpanda revenue to reveal true profit. Foodpanda typically charges 25–35%. Changing it instantly recalculates every Foodpanda order &amp; the dashboard.</p>
      <button class="btn primary" style="width:100%;justify-content:center" onclick="saveSettings()">Save settings</button>
    </div>`);
}
function saveSettings(){
  settings.businessName=document.getElementById('setName').value.trim()||settings.businessName;
  settings.fpCommission=Math.max(0,Math.min(90,parseFloat(document.getElementById('setComm').value)||0));
  state.orders.forEach(o=>{ if(o.channel==='foodpanda'){ o.commission=Math.round(o.gross*settings.fpCommission/100); o.net=o.gross-o.commission; } });
  document.getElementById('brandName').textContent=settings.businessName;
  closeModal(); toast('⚙️ Settings saved',`Commission ${settings.fpCommission}% · ${settings.businessName}`,'green'); render();
}

/* ==========================================================================
   MODAL + TOAST
   ========================================================================== */
function openModal(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('modal').classList.add('show'); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal')closeModal(); });

function toast(title,body,type){
  const el=document.createElement('div');
  el.className='toast '+(type||'');
  el.innerHTML=`<b>${title}</b><p>${body}</p>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .4s,transform .4s';el.style.opacity='0';el.style.transform='translateX(40px)';setTimeout(()=>el.remove(),400);},5200);
}

/* ==========================================================================
   NAV + BOOT
   ========================================================================== */
document.querySelectorAll('.nav-i').forEach(n=>n.addEventListener('click',()=>go(n.dataset.view)));
seed();
render();
// a live Foodpanda order shortly after load to create the "it's alive" moment
setTimeout(()=>{ if(state.view==='dashboard') simulateFoodpanda(); }, 2600);
</script>
